<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark SMP Script Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Spark SMP Script Generator</h1>
            <p>Generate scene ideas and complete scripts for your scripted Minecraft series</p>
        </header>

        <main>
            <!-- Input Form Section -->
            <section class="form-section">
                <h2>Story Setup</h2>
                
                <!-- Idea Input -->
                <div class="form-group">
                    <label for="storyIdea">Episode or Story Idea *</label>
                    <textarea 
                        id="storyIdea" 
                        placeholder="e.g., A mysterious player joins the server and starts leaving cryptic messages. The team investigates the newcomer's intentions."
                        rows="4"
                    ></textarea>
                </div>

                <!-- Scene Settings -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="sceneTone">Scene Tone *</label>
                        <select id="sceneTone">
                            <option value="">-- Select a tone --</option>
                            <option value="mysterious">Mysterious</option>
                            <option value="comedic">Comedic</option>
                            <option value="dramatic">Dramatic</option>
                            <option value="tense">Tense/Suspenseful</option>
                            <option value="emotional">Emotional</option>
                            <option value="action">Action-Packed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sceneLength">Scene Length *</label>
                        <select id="sceneLength">
                            <option value="">-- Select length --</option>
                            <option value="short">Short (1-2 min)</option>
                            <option value="medium">Medium (2-4 min)</option>
                            <option value="long">Long (4+ min)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sceneLocation">Scene Location *</label>
                    <input 
                        type="text" 
                        id="sceneLocation" 
                        placeholder="e.g., Base, Nether Fortress, Meeting Hall, Mysterious Island"
                    >
                </div>

                <!-- Actors Section -->
                <div class="form-group">
                    <label>Cast & Roles</label>
                    <div class="actors-input">
                        <input 
                            type="text" 
                            id="actorName" 
                            placeholder="Actor/Player name"
                        >
                        <input 
                            type="text" 
                            id="actorRole" 
                            placeholder="Character role/description"
                        >
                        <button type="button" class="btn-add-actor" onclick="addActor()">+ Add Actor</button>
                    </div>

                    <div id="actorsList" class="actors-list">
                        <!-- Actors will be added here dynamically -->
                    </div>
                </div>

                <!-- Generation Buttons -->
                <div class="button-group">
                    <button class="btn btn-primary" onclick="generateSceneIdea()">Generate Scene Idea</button>
                    <button class="btn btn-secondary" onclick="generateFullScript()">Generate Full Script</button>
                    <button class="btn btn-reset" onclick="resetForm()">Reset</button>
                </div>
            </section>

            <!-- Output Section -->
            <section class="output-section" id="outputSection" style="display: none;">
                <!-- Scene Idea Output -->
                <div id="sceneIdeaOutput" class="output-box" style="display: none;">
                    <div class="output-header">
                        <h3>📋 Scene Idea</h3>
                        <button class="btn-copy" onclick="copyToClipboard('sceneIdeaText')">Copy</button>
                    </div>
                    <div id="sceneIdeaText" class="output-content"></div>
                </div>

                <!-- Script Output -->
                <div id="scriptOutput" class="output-box" style="display: none;">
                    <div class="output-header">
                        <h3>🎬 Full Scene Script</h3>
                        <button class="btn-copy" onclick="copyToClipboard('scriptText')">Copy</button>
                    </div>
                    <div id="scriptText" class="output-content"></div>
                </div>

                <!-- Edit Area -->
                <div id="editArea" style="display: none;">
                    <h3>✏️ Edit Script</h3>
                    <textarea id="editableScript" rows="15"></textarea>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
                        <button class="btn btn-copy" onclick="copyToClipboard('editableScript')">Copy Edited Script</button>
                    </div>
                </div>
            </section>

            <!-- No Data Message -->
            <div id="noDataMessage" class="no-data">
                <p>👈 Fill in the form and click a button to generate your script!</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
